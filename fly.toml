# Fly.io — keep JSON data across restarts via a volume at /data.
# Free/hobby: create the volume once, then deploy.
#
#   fly apps create volta-newsletter
#   fly volumes create volta_data --region yyz --size 1
#   fly secrets set VOLTA_SESSION_SECRET="$(openssl rand -hex 32)" DEMO_MODE=true MAILCHIMP_API_KEY=DEMO_MAILCHIMP_KEY
#   fly deploy

app = 'volta-newsletter'

primary_region = 'yyz'

[build]

[env]
  VOLTA_DATA_DIR = '/data'
  DEMO_MODE = 'true'
  NEWSLETTER_CADENCE = 'monthly'
  MAILCHIMP_SERVER_PREFIX = 'us1'
  MAILCHIMP_AUDIENCE_ID = 'demo_volta_community'
  MAILCHIMP_FROM_NAME = 'Volta'
  MAILCHIMP_REPLY_TO = 'hello@voltaeffect.com'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'volta_data'
  destination = '/data'
