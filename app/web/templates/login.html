{% extends "base.html" %}
{% block title %}Login · Volta Newsletter{% endblock %}
{% block body %}
<div class="login-shell">
  <form class="login-card" method="post" action="/login">
    <div class="brand">VOLTA</div>
    <h1>Newsletter desk</h1>
    <p class="muted">Bader &amp; Matt · phone &amp; desktop</p>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <p>
      <label for="username">Desk login</label>
      <select id="username" name="username" required>
        {% for m in staff_list %}
        <option value="{{ m.username }}" {% if m.username == 'bader' %}selected{% endif %}>{{ m.display_name }}</option>
        {% endfor %}
      </select>
    </p>
    <p>
      <label for="pin">PIN</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Bader = 1111" required />
    </p>
    <button class="btn btn-primary" type="submit">Enter desk</button>
    <p class="hint">Desk PINs: Bader 1111 · Matt 2222</p>
    <p class="hint">
      Staff tips without logging in:
      <a href="/suggest">email-in / suggest →</a>
    </p>
  </form>
</div>
{% endblock %}
