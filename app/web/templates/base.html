<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121212" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>{% block title %}Volta Newsletter{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  {% if user %}
  <header class="topbar">
    <div class="brand">VOLTA</div>
    <div class="user-chip">{{ user.display_name }} · <a href="/logout">Log out</a></div>
  </header>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
