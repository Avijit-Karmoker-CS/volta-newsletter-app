# Slack app manifest — create at https://api.slack.com/apps → "From a manifest"
display_information:
  name: Volta Newsletter Tips
  description: Newsletter tips + founder consent DMs for the Volta desk.
  background_color: "#1a1a1a"
features:
  bot_user:
    display_name: Volta Newsletter
    always_online: false
  slash_commands:
    - command: /suggest-newsletter
      url: https://volta-newsletter.fly.dev/slack/suggest
      description: Send a tip to Bader's newsletter inbox
      usage_hint: "Title | Why it matters"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - users:read
settings:
  interactivity:
    is_enabled: true
    request_url: https://volta-newsletter.fly.dev/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
